version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cvsmith-postgres
    environment:
      POSTGRES_USER: cvsmith_user
      POSTGRES_PASSWORD: cvsmith_password
      POSTGRES_DB: cvsmith_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cvsmith-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvsmith_user -d cvsmith_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cvsmith-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cvsmith-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvsmith-backend
    environment:
      DATABASE_URL: postgresql://cvsmith_user:cvsmith_password@postgres:5432/cvsmith_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      ENVIRONMENT: development
      DEBUG: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CVSMITH_CLAUDE_KEY: ${CVSMITH_CLAUDE_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # PDF download: the backend's Chromium loads the CV template from the frontend container.
      PDF_TEMPLATE_URL: http://frontend:5173
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Email for login codes: until a provider is set, codes appear in `docker compose logs backend`.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@cvsmith.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cvsmith-network
    # Apply database migrations on every start (safe to repeat), then run the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvsmith-celery
    environment:
      DATABASE_URL: postgresql://cvsmith_user:cvsmith_password@postgres:5432/cvsmith_db
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CVSMITH_CLAUDE_KEY: ${CVSMITH_CLAUDE_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - cvsmith-network
    command: celery -A app.workers.celery_app worker --loglevel=info

  # Frontend Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvsmith-frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cvsmith-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  cvsmith-network:
    driver: bridge
